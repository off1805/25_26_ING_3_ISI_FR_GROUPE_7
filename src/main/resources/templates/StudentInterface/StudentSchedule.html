<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" data-theme="theme-kemoschool" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KemOSchool — Mon emploi du temps</title>
    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-background-1">
<section class="flex flex-row h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <section th:replace="~{common/SidebarFragment :: content}"></section>

    <!-- MAIN -->
    <div id="main-page" class="flex-1 flex flex-col overflow-hidden bg-background-1 min-w-0">

        <!-- ══ HEADER ══════════════════════════════════════════════════════ -->
        <header class="flex-none flex items-center gap-2 px-3 sm:px-5 py-2
                       bg-navbar border-b border-navbar-line z-20">

            <!-- Retour -->
            <a th:href="@{/student/dashboard}"
               class="size-9 shrink-0 flex items-center justify-center rounded-xl
                      bg-layer border border-layer-line text-layer-foreground
                      hover:bg-muted transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>

            <!-- Titre + classe -->
            <div class="hidden sm:flex items-center gap-2 text-sm min-w-0">
                <span class="font-bold text-layer-foreground whitespace-nowrap">Mon emploi du temps</span>
                <span class="text-muted-foreground-2">·</span>
                <span id="edit-class-label" class="text-primary font-semibold truncate"
                      th:text="${className ?: ''}"></span>
            </div>

            <!-- Navigation semaine -->
            <div class="flex-1 flex items-center justify-center gap-1 sm:justify-end sm:ms-auto">

                <button id="prev-week" type="button"
                    class="size-9 flex items-center justify-center rounded-xl
                           bg-layer border border-layer-line text-layer-foreground
                           hover:bg-muted transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                </button>

                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-layer border border-layer-line">
                    <span id="week-label" class="text-xs font-semibold text-layer-foreground"></span>
                </div>

                <button id="today-btn" type="button"
                    class="px-3 h-9 text-xs font-bold rounded-xl bg-primary/10 text-primary
                           hover:bg-primary/20 transition-colors hidden sm:flex items-center">
                    Aujourd'hui
                </button>

                <button id="next-week" type="button"
                    class="size-9 flex items-center justify-center rounded-xl
                           bg-layer border border-layer-line text-layer-foreground
                           hover:bg-muted transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m9 18 6-6-6-6"/>
                    </svg>
                </button>
            </div>

            <!-- PDF + thème -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button id="btn-export-pdf" type="button"
                    class="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl
                           bg-layer border border-layer-line text-xs font-semibold
                           text-layer-foreground hover:bg-muted transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" x2="12" y1="12" y2="18"/>
                        <line x1="9" x2="15" y1="15" y2="15"/>
                    </svg>
                    PDF
                </button>

                <button type="button" data-theme-toggle
                    class="size-9 flex items-center justify-center rounded-xl
                           bg-layer border border-layer-line text-layer-foreground
                           hover:bg-muted transition-colors">
                    <svg data-theme-icon="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 8.607 9.426a9 9 0 1 1 -9 -9.426z"/>
                    </svg>
                    <svg data-theme-icon="sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="17"
                         height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- ══ VUE MOBILE — Pills jours + liste séances (< sm) ════════════ -->
        <div class="sm:hidden flex-1 flex flex-col overflow-hidden bg-background">

            <!-- Ligne date + "Aujourd'hui" -->
            <div class="flex items-center justify-between px-4 pt-3 pb-1">
                <p class="text-xs font-semibold text-muted-foreground-2" id="mobile-date-label"></p>
                <button id="today-btn-mobile" type="button"
                    class="text-xs font-bold text-primary hover:underline">
                    Aujourd'hui
                </button>
            </div>

            <!-- Pills de jours (scroll horizontal) -->
            <div class="flex-none overflow-x-auto border-b border-card-line px-2 py-2
                        [&::-webkit-scrollbar]:hidden">
                <div id="mobile-day-pills" class="flex gap-2 min-w-max px-2"></div>
            </div>

            <!-- Liste séances du jour sélectionné -->
            <div id="mobile-session-list"
                 class="flex-1 overflow-y-auto px-4 py-4 space-y-3
                        [&::-webkit-scrollbar]:w-1
                        [&::-webkit-scrollbar-thumb]:rounded-full
                        [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
            </div>
        </div>

        <!-- ══ VUE DESKTOP — Grille (≥ sm) ════════════════════════════════ -->
        <div class="hidden sm:flex flex-1 overflow-hidden p-4 lg:p-8" id="page-content">
            <div class="h-full w-full rounded-xl border border-card-line overflow-hidden flex flex-col"
                 id="schedule-card">

                <div class="flex-1 flex flex-col relative overflow-x-auto overflow-y-hidden"
                     id="schedule-wrapper">

                    <!-- En-têtes des jours -->
                    <div id="day-headers"
                         class="flex-none grid border-b border-card-line bg-muted/30 sticky top-0 z-30 min-w-max">
                    </div>

                    <!-- Corps : grille + blocs -->
                    <div class="relative flex-1 min-w-max">
                        <div id="schedule-body" class="grid h-full"></div>
                        <div id="blocks-layer" class="absolute inset-0 pointer-events-none"></div>
                    </div>
                </div>

            </div>
        </div>

    </div><!-- /main-page -->

</section>

<!-- ══ TOAST ══ -->
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden transition-all">
    <div class="flex items-center gap-3 bg-layer border border-card-line shadow-xl rounded-2xl px-4 py-3">
        <div class="size-8 rounded-xl bg-green-50 border border-green-100 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="#10b981" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <p id="toast-msg" class="text-sm font-semibold text-layer-foreground"></p>
    </div>
</div>

<!--
    window.scheduleConfig injecté par Thymeleaf :
      readonly  : true → mode lecture seule (pas d'édition)
      classId   : ID de la classe de l'étudiant → charge l'emploi du temps de sa classe
      className : Code de la classe (ex: "L3-ISI") affiché dans le header
      viewMode  : 'student' détecté automatiquement si classId présent et teacherId absent
-->
<script th:inline="javascript">
    window.scheduleConfig = {
        readonly:  true,
        emploiId:  null,
        teacherId: null,
        classId:   /*[[${classId}]]*/ null,
        className: /*[[${className}]]*/ '',
        dateDebut: null,
        dateFin:   null,
        semaine:   null
    };
</script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Synchronise le bouton "Aujourd'hui" mobile avec celui du contrôleur
        const mobileTodayBtn = document.getElementById('today-btn-mobile');
        const mainTodayBtn   = document.getElementById('today-btn');
        if (mobileTodayBtn && mainTodayBtn) {
            mobileTodayBtn.addEventListener('click', () => mainTodayBtn.click());
        }
        const updateMobileLabel = () => {
            const lbl = document.getElementById('mobile-date-label');
            if (lbl) lbl.textContent = new Date().toLocaleDateString('fr-FR', {
                weekday: 'long', day: 'numeric', month: 'long'
            });
        };
        updateMobileLabel();
        ['prev-week', 'next-week', 'today-btn'].forEach(id =>
            document.getElementById(id)?.addEventListener('click', updateMobileLabel)
        );
    });
</script>

<script th:src="@{/js/preline.js}"></script>
<script type="module" th:src="@{/js/common/themeToggle.js}"></script>
<script type="module" th:src="@{/js/APInterface/scheduleController.js}"></script>

</body>
</html>
