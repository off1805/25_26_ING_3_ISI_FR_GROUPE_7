<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KemOSchool — Administration</title>

  <link rel="stylesheet" th:href="@{/css/output.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">




  <!-- Bootstrap (local) -->


  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>



<body class=" h-screen">
  <section class="flex flex-row bg-gray-50 h-full">
    <div class="lg:hidden py-16 text-center ">

    </div>

    <!-- SIDEBAR — chargée dynamiquement via sidebar-loader.js -->
    <div id="sidebar-placeholder"></div>


    <section class=" flex-1">
      <header class="flex flex-wrap lg:justify-start lg:flex-nowrap  py-1 bg-navbar  relative  w-fullflex justify-between basis-full items-center px-4 md:px-6 lg:px-8 mx-auto border border-b border-navbar-line">


          <div class="lg:hidden">


            <button type="button"
              class="hs-collapse-toggle size-9.5 flex justify-center items-center text-sm font-semibold rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus disabled:opacity-50 disabled:pointer-events-none"
              aria-haspopup="dialog" aria-expanded="false" aria-controls="hs-app-sidebar"
              aria-label="Toggle navigation" data-hs-overlay="#hs-app-sidebar">
              <svg class="hs-collapse-open:hidden shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" x2="21" y1="6" y2="6" />
                <line x1="3" x2="21" y1="12" y2="12" />
                <line x1="3" x2="21" y1="18" y2="18" />
              </svg>

              <svg class="hs-collapse-open:block hidden shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>

          <!-- Button Group -->
          <div class="flex items-center gap-x-1 lg:gap-x-2 ms-auto py-1 lg:ps-6 lg:order-3 lg:col-span-3">
            <button type="button"
              class="size-9.5 relative flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted-hover focus:outline-hidden focus:bg-muted-focus disabled:opacity-50 disabled:pointer-events-none">
              <span class="sr-only">Search</span>
              <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
              </svg>
            </button>
            <button type="button"
              class="size-9.5 relative flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted-hover focus:outline-hidden focus:bg-muted-focus disabled:opacity-50 disabled:pointer-events-none">
              <span class="sr-only">Cart</span>
              <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="21" r="1" />
                <circle cx="19" cy="21" r="1" />
                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
              </svg>
            </button>
            <button type="button" data-theme-toggle
              class="size-9.5 relative flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted-hover focus:outline-hidden focus:bg-muted-focus disabled:opacity-50 disabled:pointer-events-none">
              <span class="sr-only" data-theme-toggle-label>Passer en theme sombre</span>
              <svg data-theme-icon="moon" class="shrink-0" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 8.607 9.426a9 9 0 1 1 -9 -9.426z" />
              </svg>
              <svg data-theme-icon="sun" class="hidden shrink-0" xmlns="http://www.w3.org/2000/svg" width="18"
                height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="M4.93 4.93l1.41 1.41" />
                <path d="M17.66 17.66l1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="M6.34 17.66l-1.41 1.41" />
                <path d="M19.07 4.93l-1.41 1.41" />
              </svg>
            </button>



          </div>




      </header>

    </section>

  </section>

<script th:src="@{/js/preline.js}"></script>
<script type="module" th:src="@{/js/common/themeToggle.js}"></script>
  <script>
    // Attend que le DOM soit chargé



      // PAS D'IMPORT ICI - HSStaticMethods est déjà chargé par le fichier preline.js précédent

      document.addEventListener('DOMContentLoaded', () => {
      // Vérification que le script est bien chargé
      if (typeof HSStaticMethods !== 'undefined') {
      HSStaticMethods.autoInit();
      console.log("Preline initialisé avec succès !");
    } else {
      console.error("Erreur : Le fichier preline.js n'est pas chargé correctement.");
    }
    });

      // Pour gérer les fragments Thymeleaf ou les chargements lents
      window.addEventListener('load', () => {
      if (typeof HSStaticMethods !== 'undefined') {
      HSStaticMethods.autoInit();
    }
    });

    </script>
    <script src="/js/common/sidebar-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSidebar('dashboard', null);
        });
    </script>



</body>

</html>
