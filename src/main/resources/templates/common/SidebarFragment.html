<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <!--
  SidebarFragment.html — Rendu côté serveur et injecté dynamiquement côté client.
  Variables model attendues :
    sidebarRole        : rôle de l'utilisateur (ADMIN, AP, TEACHER, STUDENT)
    sidebarFullName    : nom complet
    sidebarPhotoUrl    : photo de profil (optionnel)
    activePage         : identifiant de la page active
    subjectsFiliereId  : id filière pour les liens AP (optionnel)
-->
    <section id="hs-app-sidebar" class="hs-overlay [--auto-close:lg] hs-overlay-minified:w-13 lg:block lg:translate-x-0 lg:end-auto lg:bottom-0
                w-64 hs-overlay-open:translate-x-0 -translate-x-full transition-all duration-300 transform
                h-full hidden overflow-x-hidden z-60
                bg-sidebar border-e border-sidebar-line" role="dialog" tabindex="-1" aria-label="Sidebar"
        th:fragment="content">

        <div class="relative flex flex-col h-full max-h-full">

            <!-- Header -->
            <header class="py-4 px-2 flex justify-between items-center gap-x-2">
                <!-- Brand (caché quand réduit) -->
                <div class="flex items-center gap-2.5 min-w-0 hs-overlay-minified:hidden">
                    <div class="size-9 rounded-xl bg-primary flex items-center justify-center shrink-0 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                            <path d="M6 12v5c3 3 9 3 12 0v-5" />
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <p class="font-bold text-sm text-layer-foreground leading-tight truncate">KemOSchool</p>
                        <p class="text-xs text-muted-foreground-2 truncate"
                            th:text="${sidebarRole != null ? sidebarRole : 'ROLE'}">ROLE</p>
                    </div>
                </div>

                <!-- Icône seule (visible quand réduit) -->
                <div class="hidden hs-overlay-minified:flex items-center justify-center">
                    <div class="size-9 rounded-xl bg-primary flex items-center justify-center shrink-0 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                            <path d="M6 12v5c3 3 9 3 12 0v-5" />
                        </svg>
                    </div>
                </div>

                <!-- Bouton fermer (mobile) -->
                <button type="button"
                    class="lg:hidden flex justify-center items-center size-7 rounded-lg text-muted-foreground-2 hover:bg-muted focus:outline-none"
                    data-hs-overlay="#hs-app-sidebar">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                    <span class="sr-only">Fermer</span>
                </button>

                <!-- Bouton toggle (desktop) -->
                <button type="button" class="hidden lg:flex justify-center items-center size-7 rounded-full text-muted-foreground-2
                           hover:bg-muted-hover focus:outline-none focus:bg-muted-focus
                           disabled:opacity-50 disabled:pointer-events-none" aria-haspopup="dialog"
                    aria-expanded="false" aria-controls="hs-app-sidebar" aria-label="Réduire la navigation"
                    data-hs-overlay-minifier="#hs-app-sidebar">
                    <!-- Icône quand réduit : déplier -->
                    <svg class="hidden hs-overlay-minified:block shrink-0 size-4" xmlns="http://www.w3.org/2000/svg"
                        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M15 3v18" />
                        <path d="m8 9 3 3-3 3" />
                    </svg>
                    <!-- Icône quand déplié : réduire -->
                    <svg class="hs-overlay-minified:hidden shrink-0 size-4" xmlns="http://www.w3.org/2000/svg"
                        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M15 3v18" />
                        <path d="m10 15-3-3 3-3" />
                    </svg>
                    <span class="sr-only">Toggle navigation</span>
                </button>
            </header>
            <!-- End Header -->

            <!-- Nav -->

                    [&::-webkit-scrollbar]:w-1.5
                    [&::-webkit-scrollbar-track]:bg-transparent
                    [&::-webkit-scrollbar-thumb]:rounded-full
                    [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">

                        <!-- ADMIN -->

                                    fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                    stroke-linejoin="round">

                                    <circle cx="9" cy="7" r="4" />

                                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />

                        <li th:if="${sidebarRole == 'ADMIN'}">

                                class="group w-full flex items-center gap-x-3 py-2 px-2.5 text-sm font-medium rounded-md
                                  focus:outline-none transition-colors hs-overlay-minified:justify-center hs-overlay-minified:w-fit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"

                                </svg>

                            </a>

                        <!-- AP -->

                                class="group w-full flex items-center gap-x-3 py-2 px-2.5 text-sm font-medium rounded-md
                                  focus:outline-none transition-colors hs-overlay-minified:justify-center hs-overlay-minified:w-fit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"

                                  focus:outline-none transition-colors hs-overlay-minified:justify-center hs-overlay-minified:w-fit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                    <circle cx="9" cy="7" r="4" />
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />

                                </svg>

                            </a>

                        <li th:if="${sidebarRole == 'AP'}">

                                th:classappend="${activePage == 'config'} ?
                           'bg-sidebar-nav-active text-layer-foreground font-semibold' :
                           'text-muted-foreground-2 hover:bg-sidebar-nav-hover hover:text-layer-foreground focus:bg-sidebar-nav-focus'"
                                class="group w-full flex items-center gap-x-3 py-2 px-2.5 text-sm font-medium rounded-md
                                  focus:outline-none transition-colors hs-overlay-minified:justify-center hs-overlay-minified:w-fit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3" />

                                </svg>
                                <span class="hs-overlay-minified:hidden">Configuration</span>
                            </a>
                        </li>

                                  focus:outline-none transition-colors hs-overlay-minified:justify-center hs-overlay-minified:w-fit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7" rx="2" />
                                    <rect x="14" y="3" width="7" height="4" rx="2" />
                                    <rect x="14" y="10" width="7" height="11" rx="2" />
                                    <rect x="3" y="13" width="7" height="8" rx="2" />
                                </svg>
                                <span class="hs-overlay-minified:hidden">Dashboard</span>
                            </a>
                        </li>

                        <li th:if="${sidebarRole == 'TEACHER'}">
                            <a th:href="@{/teacher/seance}"
                                th:classappend="${activePage == 'seance'} ?
                           'bg-sidebar-nav-active text-layer-foreground font-semibold' :
                           'text-muted-foreground-2 hover:bg-sidebar-nav-hover hover:text-layer-foreground focus:bg-sidebar-nav-focus'"
                                class="group w-full flex items-center gap-x-3 py-2 px-2.5 text-sm font-medium rounded-md

                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"

                                    <path d="M16 9l5-3v12l-5-3" />
                                    <path d="M7 10h4" />
                                    <path d="M7 14h2" />
                                </svg>

                           'text-muted-foreground-2 hover:bg-sidebar-nav-hover hover:text-layer-foreground focus:bg-sidebar-nav-focus'"

                                </svg>

                        </li>

                        <li th:if="${sidebarRole == 'STUDENT'}">
                            <a th:href="@{/student/schedule}"
                                th:classappend="${activePage == 'schedule'} ?

                            </a>
                        </li>

                        <li th:if="${sidebarRole == 'STUDENT'}">
                            <a th:href="@{/student/absences}"
                                th:classappend="${activePage == 'absences'} ?
                           'bg-sidebar-nav-active text-layer-foreground font-semibold' :
                           'text-muted-foreground-2 hover:bg-sidebar-nav-hover hover:text-layer-foreground focus:bg-sidebar-nav-focus'"

            <!-- End Nav -->

            <!-- Profile -->
            <form id="profile-nav-form" method="post" action="/profile" class="hidden">
                <input type="hidden" name="token" id="profile-nav-token" />
            </form>
            <a href="javascript:void(0)" onclick="navigateToProfile()" class="flex items-center gap-3 px-3 py-4 border-t border-sidebar-line
                  hs-overlay-minified:justify-center hs-overlay-minified:px-2
                  hover:bg-sidebar-nav-hover transition-colors cursor-pointer group">

                <!-- Photo de profil ou icône SVG par défaut -->
                <div th:if="${sidebarPhotoUrl != null and !#strings.isEmpty(sidebarPhotoUrl)}"
                    class="size-9 rounded-full shrink-0 overflow-hidden border border-primary/20">
                    <img th:src="${sidebarPhotoUrl}" alt="Photo de profil" class="w-full h-full object-cover" />
                </div>
                <div th:if="${sidebarPhotoUrl == null or #strings.isEmpty(sidebarPhotoUrl)}"
                    class="size-9 rounded-full bg-primary/10 border border-primary/20 shrink-0 flex items-center justify-center text-primary group-hover:bg-primary/20 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 20a8 8 0 0 1 16 0"></path>
                    </svg>
                </div>

                <div class="hs-overlay-minified:hidden min-w-0 flex-1">
                    <p class="text-sm font-bold text-layer-foreground truncate"
                        th:text="${sidebarFullName != null ? sidebarFullName : 'Utilisateur'}">Utilisateur</p>
                    <p class="text-xs text-muted-foreground-2 truncate"
                        th:text="${sidebarRole != null ? sidebarRole : 'ROLE'}">ROLE</p>
                </div>
            </a>
            <script>
                function navigateToProfile() {
                    const token = localStorage.getItem('token');
                    if (!token) { window.location.href = '/login'; return; }
                    document.getElementById('profile-nav-token').value = token;
                    document.getElementById('profile-nav-form').submit();
                }
            </script>
            <!-- End Profile -->

        </div>

        <script>
            (function () {
                const sidebar = document.getElementById('hs-app-sidebar');
                if (!sidebar) return;

                sidebar.addEventListener('click', function (e) {
                    if (!sidebar.classList.contains('minified')) return;
                    if (e.target.closest('[data-hs-overlay-minifier]')) return;
                    if (window.HSOverlay) {
                        window.HSOverlay.minify('#hs-app-sidebar', false);
                    } else {
                        const toggleBtn = sidebar.querySelector('[data-hs-overlay-minifier]');
                        if (toggleBtn) toggleBtn.click();
                    }
                });

                sidebar.addEventListener('mouseenter', function () {
                    if (sidebar.classList.contains('minified')) sidebar.style.cursor = 'pointer';
                });
                sidebar.addEventListener('mouseleave', function () {
                    sidebar.style.cursor = '';
                });
            })();
        </script>

    </section>
</body>

</html>
