<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" data-theme="theme-kemoschool">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>KemOSchool — Absences</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="h-screen bg-background-1">
<section class="flex flex-row h-full">

    <section th:replace="~{common/SidebarFragment :: content}"></section>

    <section class="flex-1 flex flex-col overflow-hidden">

        <!-- NAVBAR -->
        <header class="flex-none flex justify-between items-center px-5 sm:px-7 py-3 bg-navbar border-b border-navbar-line">
            <div class="flex items-center gap-3">
                <button type="button"
                        class="lg:hidden size-9 flex items-center justify-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-layer-hover transition-colors"
                        data-hs-overlay="#hs-app-sidebar" aria-controls="hs-app-sidebar" aria-label="Ouvrir menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <nav class="hidden lg:flex items-center gap-x-1.5 text-xs text-muted-foreground">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M5 12l-2 0l9-9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>
                    </svg>
                    <span>AP Panel</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 6l6 6l-6 6"/>
                    </svg>
                    <span class="font-semibold text-layer-foreground">Absences</span>
                </nav>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" data-theme-toggle
                        class="size-9 flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted transition-colors">
                    <svg data-theme-icon="moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 8.607 9.426a9 9 0 1 1 -9 -9.426z"/>
                    </svg>
                    <svg data-theme-icon="sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                    </svg>
                </button>
                <div th:text="${sidebarFullName != null ? #strings.toUpperCase(#strings.substring(sidebarFullName, 0, 1)) : 'A'}"
                     class="size-9 rounded-xl bg-primary flex items-center justify-center text-sm font-bold text-white cursor-pointer shadow-sm">A</div>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="flex-1 overflow-y-auto">
            <div class="px-4 sm:px-6 lg:px-8 py-7 max-w-7xl mx-auto space-y-5">

                <!-- HEADER ROW -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-black text-layer-foreground">Absences</h1>
                        <p class="text-sm text-muted-foreground-2 mt-1"
                           th:text="${filiere != null ? 'Vue consolidée — ' + filiere.nom() : 'Vue consolidée des absences par étudiant'}">
                            Vue consolidée des absences par étudiant
                        </p>
                    </div>
                    <button type="button" id="btn-export-csv"
                            class="flex items-center gap-2 px-4 py-2 rounded-xl bg-muted text-layer-foreground text-xs font-semibold hover:bg-muted/80 transition-colors border border-card-line">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Exporter CSV
                    </button>
                </div>

                <!-- KPI SUMMARY ROW -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="kpi-row">
                    <div class="bg-card border border-card-line rounded-2xl p-4">
                        <p class="text-xs text-muted-foreground-2 font-medium mb-1">Étudiants</p>
                        <p class="text-2xl font-black text-layer-foreground" id="kpi-etudiants">—</p>
                    </div>
                    <div class="bg-card border border-card-line rounded-2xl p-4">
                        <p class="text-xs text-muted-foreground-2 font-medium mb-1">Total absences</p>
                        <p class="text-2xl font-black text-layer-foreground" id="kpi-absences">—</p>
                    </div>
                    <div class="bg-card border border-card-line rounded-2xl p-4">
                        <p class="text-xs text-muted-foreground-2 font-medium mb-1">Non justifiées</p>
                        <p class="text-2xl font-black text-red-500" id="kpi-non-just">—</p>
                    </div>
                    <div class="bg-card border border-card-line rounded-2xl p-4">
                        <p class="text-xs text-muted-foreground-2 font-medium mb-1">Taux moyen</p>
                        <p class="text-2xl font-black text-layer-foreground" id="kpi-taux">—</p>
                    </div>
                </div>

                <!-- FILTER BAR -->
                <div class="bg-card border border-card-line rounded-2xl p-4">
                    <div class="flex flex-wrap items-end gap-3">

                        <!-- Recherche -->
                        <div class="flex-1 min-w-[180px]">
                            <label class="block text-xs font-medium text-muted-foreground-2 mb-1.5">Rechercher</label>
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground-2" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                                </svg>
                                <input type="text" id="search-input" placeholder="Nom, prénom ou matricule…"
                                       class="w-full pl-8 pr-3 py-2 text-xs rounded-xl bg-muted border-0 text-layer-foreground placeholder-muted-foreground-2 focus:outline-none focus:ring-2 focus:ring-primary/30"/>
                            </div>
                        </div>

                        <!-- Classe -->
                        <div class="min-w-[140px]">
                            <label class="block text-xs font-medium text-muted-foreground-2 mb-1.5">Classe</label>
                            <select id="filter-classe"
                                    class="w-full text-xs px-3 py-2 rounded-xl bg-muted border-0 text-layer-foreground font-medium focus:outline-none focus:ring-2 focus:ring-primary/30 cursor-pointer">
                                <option value="">Toutes</option>
                            </select>
                        </div>

                        <!-- Matière -->
                        <div class="min-w-[160px]">
                            <label class="block text-xs font-medium text-muted-foreground-2 mb-1.5">Matière</label>
                            <select id="filter-ue"
                                    class="w-full text-xs px-3 py-2 rounded-xl bg-muted border-0 text-layer-foreground font-medium focus:outline-none focus:ring-2 focus:ring-primary/30 cursor-pointer">
                                <option value="">Toutes</option>
                            </select>
                        </div>

                        <!-- Date début -->
                        <div class="min-w-[140px]">
                            <label class="block text-xs font-medium text-muted-foreground-2 mb-1.5">Du</label>
                            <input type="date" id="filter-date-debut"
                                   class="w-full text-xs px-3 py-2 rounded-xl bg-muted border-0 text-layer-foreground focus:outline-none focus:ring-2 focus:ring-primary/30"/>
                        </div>

                        <!-- Date fin -->
                        <div class="min-w-[140px]">
                            <label class="block text-xs font-medium text-muted-foreground-2 mb-1.5">Au</label>
                            <input type="date" id="filter-date-fin"
                                   class="w-full text-xs px-3 py-2 rounded-xl bg-muted border-0 text-layer-foreground focus:outline-none focus:ring-2 focus:ring-primary/30"/>
                        </div>

                        <!-- Reset -->
                        <button type="button" id="btn-reset"
                                class="px-4 py-2 text-xs font-medium text-muted-foreground-2 rounded-xl hover:bg-muted transition-colors">
                            Réinitialiser
                        </button>

                    </div>
                </div>

                <!-- TABLE CARD -->
                <div class="bg-card border border-card-line rounded-2xl overflow-hidden">

                    <!-- Loading state -->
                    <div id="table-loading" class="flex items-center justify-center py-16 gap-3 text-muted-foreground-2">
                        <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                        </svg>
                        <span class="text-sm">Chargement…</span>
                    </div>

                    <!-- Empty state -->
                    <div id="table-empty" class="hidden flex-col items-center justify-center py-16 text-center">
                        <div class="size-12 rounded-2xl bg-muted flex items-center justify-center mx-auto mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-muted-foreground-2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <line x1="23" y1="11" x2="17" y2="11"/>
                            </svg>
                        </div>
                        <p class="text-sm font-semibold text-layer-foreground">Aucun résultat</p>
                        <p class="text-xs text-muted-foreground-2 mt-1">Aucune absence ne correspond aux filtres sélectionnés.</p>
                    </div>

                    <!-- Table -->
                    <div id="table-wrap" class="hidden overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b border-card-line bg-surface">
                                    <th class="px-4 py-3 text-xs font-medium text-muted-foreground-2/60 tracking-widest uppercase">Étudiant</th>
                                    <th class="px-4 py-3 text-xs font-medium text-muted-foreground-2/60 tracking-widest uppercase hidden sm:table-cell">Classe</th>
                                    <th class="px-4 py-3 text-xs font-medium text-muted-foreground-2/60 tracking-widest uppercase text-center">Absences</th>
                                    <th class="px-4 py-3 text-xs font-medium text-muted-foreground-2/60 tracking-widest uppercase text-center hidden md:table-cell">Justifiées</th>
                                    <th class="px-4 py-3 text-xs font-medium text-muted-foreground-2/60 tracking-widest uppercase text-center hidden md:table-cell">En attente</th>
                                    <th class="px-4 py-3 text-xs font-medium text-muted-foreground-2/60 tracking-widest uppercase text-center hidden md:table-cell">Non just.</th>
                                    <th class="px-4 py-3 text-xs font-medium text-muted-foreground-2/60 tracking-widest uppercase hidden lg:table-cell">Taux</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="divide-y divide-card-line">
                            </tbody>
                        </table>
                    </div>

                    <!-- Footer with count -->
                    <div id="table-footer" class="hidden border-t border-card-line px-4 py-3">
                        <p class="text-xs text-muted-foreground-2" id="table-count"></p>
                    </div>

                </div>
            </div>
        </div>

    </section>
</section>

<script th:src="@{/js/main.js}" type="module"></script>
<script th:src="@{/js/APInterface/apAbsences.js}" type="module"></script>
</body>
</html>
