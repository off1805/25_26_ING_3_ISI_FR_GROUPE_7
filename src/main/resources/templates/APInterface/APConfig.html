<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" data-theme="theme-kemoschool">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KemOSchool — Configuration</title>
    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <link rel="stylesheet" th:href="@{/css/toastify.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <!-- CSRF pour les POST fetch -->
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}" />
</head>

<body class="h-screen bg-background">
    <section class="flex flex-row bg-sidebar-nav-hover h-full">

        <!-- SIDEBAR -->
        <section th:replace="~{common/SidebarFragment :: content}"></section>

        <section class="flex-1 flex flex-col overflow-hidden">
            <!-- NAVBAR -->
            <header
                class="flex-none flex justify-between items-center px-4 sm:px-6 py-2 bg-navbar border-b border-navbar-line">
                <div class="flex items-center gap-3">
                    <button type="button"
                        class="lg:hidden size-9 flex items-center justify-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-layer-hover transition-colors"
                        data-hs-overlay="#hs-app-sidebar" aria-controls="hs-app-sidebar" aria-label="Ouvrir menu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <nav class="hidden lg:flex items-center gap-x-1.5 text-sm text-muted-foreground">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5">
                            <path d="M5 12l-2 0l9-9l9 9l-2 0" />
                            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
                        </svg>
                        <span>AP Panel</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M9 6l6 6l-6 6" />
                        </svg>
                        <span class="font-semibold text-layer-foreground">Configuration</span>
                    </nav>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" data-theme-toggle
                        class="size-9 flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted">
                        <!-- Theme SVG icons -->
                        <svg data-theme-icon="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                            <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 8.607 9.426a9 9 0 1 1 -9 -9.426z" />
                        </svg>
                        <svg data-theme-icon="sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="17"
                            height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                        </svg>
                    </button>
                    <!-- User Avatar -->
                    <div
                        class="size-9 rounded-xl bg-primary flex items-center justify-center text-sm font-bold text-white cursor-pointer">
                        A
                    </div>
                </div>
            </header>

            <!-- PAGE CONTENT -->
            <div class="flex-1 overflow-y-auto bg-background p-6 lg:p-10">
                <div class="mx-auto max-w-5xl pb-6">

                    <!-- HERO -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-7">
                       
                            <h2 class="text-2xl font-bold text-layer-foreground">Configuration</h2>
                           
                      
                    </div>

                    <!-- LIST DE NIVEAUX (style list-group, description unique) -->
                    <div class="grid gap-4">
                        <p class="text-lg font-semibold ">Semestre actif
                            </p>

                        <ul class="max-w-full w-full flex flex-col bg-card ">
                            <li th:each="niveau,iterStat : ${niveaux}"
                                class="inline-flex items-center gap-x-4 py-2 px-6 text-sm font-medium text-layer-foreground  border border-layer-line -mt-px first:rounded-t-2xl first:mt-0 last:rounded-b-2xl">

                                <div class="flex flex-col">
                                    <h3 th:text="${'Niveau ' + niveau.ordre}">Niveau</h3>
                                </div>

                                <div class="ms-auto flex items-center gap-3">

                                   
                                        <div class="flex  p-1 px-2 py-0.5 ">

                                            <button type="button" th:onclick="updateSemestre([[${niveau.id}]], 1, this)"
                                                th:classappend="${niveau.semestreActif == 1} ? 'bg-surface-active text-primary' : 'text-muted-foreground-2 hover:bg-muted'"
                                                class="semestre-btn-1 relative px-5 py-1.5 text-xs  rounded-full transition-all focus:outline-none">
                                                1
                                            </button>
                                            <button type="button" th:onclick="updateSemestre([[${niveau.id}]], 2, this)"
                                                th:classappend="${niveau.semestreActif == 2} ? 'bg-surface-active text-primary' : 'text-muted-foreground-2 hover:bg-muted'"
                                                class="semestre-btn-2 relative px-5 py-1.5 text-xs  rounded-full transition-all focus:outline-none">
                                                2
                                            </button>
                                        </div>

                                    

                                </div>
                            </li>

                            <!-- EMPTY STATE -->
                            <li th:if="${niveaux == null or #lists.isEmpty(niveaux)}"
                                class="flex flex-col items-center justify-center text-center py-12 gap-4">
                                <div class="size-16 rounded-2xl bg-muted flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="1.25"
                                        class="text-muted-foreground-2">
                                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                                    </svg>
                                </div>
                                <div>
                                    <p class="text-sm font-semibold text-layer-foreground">Aucun Niveau</p>
                                    <p class="text-xs text-muted-foreground-2 mt-1">Vous n'avez aucun niveau assigné.
                                    </p>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </section>
    <script th:src="@{/js/preline.js}"></script>
    <script type="module" th:src="@{/js/common/themeToggle.js}"></script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        function updateSemestre(niveauId, semestreActif, btnElement) {
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            const token = localStorage.getItem('token');

            const formData = new URLSearchParams();
            formData.append("semestreActif", semestreActif);

            const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

            // Optional visual feedback instantly
            const parent = btnElement.parentElement;
            const btn1 = parent.querySelector('.semestre-btn-1');
            const btn2 = parent.querySelector('.semestre-btn-2');

            // Optimistic UI update (no shadow classes)
            btn1.classList.remove('bg-primary', 'text-white');
            btn1.classList.add('text-muted-foreground-2', 'hover:bg-muted');
            btn2.classList.remove('bg-primary', 'text-white');
            btn2.classList.add('text-muted-foreground-2', 'hover:bg-muted');

            if (semestreActif === 1) {
                btn1.classList.add('bg-primary', 'text-white');
                btn1.classList.remove('text-muted-foreground-2', 'hover:bg-muted');
            } else {
                btn2.classList.add('bg-primary', 'text-white');
                btn2.classList.remove('text-muted-foreground-2', 'hover:bg-muted');
            }

            import('/js/common/ClientHttp.js').then(({ default: api }) => {
                api.post(`/ap/config/niveau/${niveauId}/semestre`, formData, headers)
                    .then(res => {
                        Toastify({
                            text: `Semestre ${semestreActif} activé avec succès.`,
                            duration: 3000,
                            close: true,
                            gravity: "top",
                            position: "right",
                            style: {
                                background: "#10b981", // green text bg
                                borderRadius: '10px'
                            }
                        }).showToast();
                    })
                    .catch(error => {
                        throw new Error(error.message || "Erreur lors de la modification");
                    });
            })
                .catch(error => {
                    Toastify({
                        text: error.message || "Erreur serveur.",
                        duration: 4000,
                        close: true,
                        gravity: "top",
                        position: "right",
                        style: {
                            background: "#ef4444", // red text bg
                            color: "white",
                            borderRadius: '10px'
                        }
                    }).showToast();

                    // Revert UI Update on failure
                    // We just reload the page to refresh truth
                    setTimeout(() => window.location.reload(), 1500);
                });
        }
    </script>
</body>

</html>
