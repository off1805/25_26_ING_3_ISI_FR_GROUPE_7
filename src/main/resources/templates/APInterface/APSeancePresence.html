<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" data-theme="theme-kemoschool">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KemOSchool — Liste de présence</title>
    <link rel="stylesheet" th:href="@{/css/output.css}" />
</head>

<body class="h-screen bg-background-1" th:attr="data-seance-id=${seanceId}">
    <section class="flex flex-col h-full">

        <!-- NAVBAR -->
        <header
            class="flex-none flex justify-between items-center px-5 sm:px-7 py-3 bg-navbar border-b border-navbar-line">
            <div class="flex items-center gap-3">
                <nav class="flex items-center gap-x-1.5 text-xs text-muted-foreground">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5">
                        <path d="M5 12l-2 0l9-9l9 9l-2 0" />
                        <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
                    </svg>
                    <span>AP Panel</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M9 6l6 6l-6 6" />
                    </svg>
                    <a th:href="@{/ap/seances}" class="hover:text-layer-foreground transition-colors">Séances</a>
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M9 6l6 6l-6 6" />
                    </svg>
                    <span class="font-semibold text-layer-foreground">Liste de présence</span>
                </nav>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" data-theme-toggle
                    class="size-9 flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted transition-colors">
                    <svg data-theme-icon="moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 8.607 9.426a9 9 0 1 1 -9 -9.426z" />
                    </svg>
                    <svg data-theme-icon="sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="15"
                        height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                    </svg>
                </button>
                <div th:text="${sidebarFullName != null ? #strings.toUpperCase(#strings.substring(sidebarFullName, 0, 1)) : 'A'}"
                    class="size-9 rounded-xl bg-primary flex items-center justify-center text-sm font-bold text-white cursor-pointer shadow-sm">
                    A</div>
            </div>
        </header>

        <!-- PAGE -->
        <div class="flex-1 overflow-y-auto">
            <div class="px-4 sm:px-6 lg:px-8 py-7 max-w-7xl mx-auto space-y-6">

                <!-- BACK -->
                <a th:href="@{/ap/seances}"
                    class="inline-flex items-center gap-1.5 text-xs font-medium text-muted-foreground-2 hover:text-primary transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                    Retour aux séances
                </a>

                <!-- HERO -->
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                    <div class="min-w-0">
                        <h1 class="text-2xl font-black text-layer-foreground" id="seance-titre">—</h1>
                        <p class="text-sm text-muted-foreground-2 mt-1.5">Liste de présence</p>
                    </div>
                    <button type="button" id="btn-export-excel"
                        class="flex items-center gap-2 px-4 py-2 rounded-lg bg-muted text-layer-foreground text-sm font-medium hover:bg-muted/80 transition-colors border border-card-line shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        Exporter Excel
                    </button>
                </div>

                <!-- INFOS & STATS SEANCE -->
                <div id="seance-info-list"
                    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-x-6 gap-y-4 pb-5 border-b border-card-line">
                </div>

                <!-- TABLEAU PRESENCE -->
                <div class="bg-card rounded-xl border border-card-line overflow-hidden pb-2">
                    <div id="presence-table-wrap" class="hidden overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr id="presence-table-head" class="bg-surface"></tr>
                            </thead>
                            <tbody id="presence-table-body"></tbody>
                        </table>
                    </div>

                    <div id="presence-loading" class="flex flex-col items-center justify-center py-16 gap-3">
                        <div class="size-8 rounded-full border-2 border-primary border-t-transparent animate-spin">
                        </div>
                        <p class="text-sm text-muted-foreground-2">Chargement de la liste de présence…</p>
                    </div>

                    <div id="presence-empty"
                        class="hidden flex-col items-center justify-center py-16 gap-3 text-center">
                        <div class="size-14 rounded-2xl bg-muted flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.25"
                                class="text-muted-foreground-2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <line x1="23" y1="11" x2="17" y2="11" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-layer-foreground">Aucune liste de présence</p>
                            <p class="text-xs text-muted-foreground-2 mt-1">L'appel n'a pas encore été effectué
                                pour cette séance.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </section>

    <script th:src="@{/js/preline.js}"></script>
    <script type="module" th:src="@{/js/common/themeToggle.js}"></script>
    <script th:src="@{/js/main.js}" type="module"></script>
    <script th:src="@{/js/APInterface/apSeancePresence.js}" type="module"></script>
</body>

</html>
