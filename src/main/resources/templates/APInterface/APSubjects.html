<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" class="dark" data-theme="theme-kemoschool">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KemOSchool — Matieres (AP)</title>

    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>

<body class="h-screen" th:attr="data-ap-page-bc=${apPageBreadcrumb}">
    <section class="flex flex-row bg-sidebar-nav-hover h-full">

        <!-- SIDEBAR -->
        <section th:replace="~{common/AppSidebar :: app-sidebar('subjects', ${subjectsFiliereId})}"></section>
        <!-- MAIN -->
        <section class="flex-1 flex flex-col overflow-hidden">

            <!-- NAVBAR -->
            <header class="flex-none flex justify-between items-center px-4 sm:px-6 py-2 bg-navbar border-b border-navbar-line">
                <div class="flex items-center gap-3">
                    <button type="button" class="lg:hidden size-9 flex items-center justify-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-layer-hover transition-colors" data-hs-overlay="#hs-app-sidebar" aria-controls="hs-app-sidebar" aria-label="Ouvrir menu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <nav class="hidden lg:flex items-center gap-x-1.5 text-sm text-muted-foreground">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12l-2 0l9-9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
                        <span>AP Panel</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6l-6 6"/></svg>
                        <span class="font-semibold text-layer-foreground">Unités d'enseignement</span>
                    </nav>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" data-theme-toggle class="size-9 flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted">
                        <svg data-theme-icon="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 8.607 9.426a9 9 0 1 1 -9 -9.426z"/></svg>
                        <svg data-theme-icon="sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    </button>
                    <button type="button" class="size-9 flex items-center justify-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted relative">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg>
                        <span class="absolute top-1.5 right-1.5 size-2 bg-red-500 rounded-full border-2 border-navbar"></span>
                    </button>
                    <div class="size-9 rounded-xl bg-primary flex items-center justify-center text-sm font-bold text-white cursor-pointer shadow-sm"
                         th:text="${ap != null and ap.profile != null and ap.profile.nom != null ? #strings.toUpperCase(#strings.substring(ap.profile.nom, 0, 1)) : 'A'}">A</div>
                </div>

            </header>

            <!-- PAGE CONTENT -->
            <div class="flex-1 overflow-y-auto p-6 lg:p-10 bg-background">
                <div class=" w-full mx-auto">

                    <!-- Page Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                        <div>
                            <h2 class="text-2xl font-bold text-layer-foreground">Unites d'enseignement</h2>
                            <p class="text-sm text-muted-foreground-2 mt-1">Gestion des unités d'enseignement par niveau
                                et spécialité.</p>
                        </div>
                        <button type="button" data-hs-overlay="#hs-modal-add-ue"
                            class="inline-flex items-center gap-2 px-5 py-2 text-sm font-semibold bg-primary text-white rounded-lg  hover:bg-primary-hover transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M5 12h14M12 5v14" />
                            </svg>
                            Ajouter une UE
                        </button>
                    </div>

                    <!-- Level Tabs -->
                    <div class="flex mb-7">
                        <div class="flex bg-surface  rounded-lg transition p-1">
                            <nav id="level-tabs" class="flex gap-x-1" aria-label="Tabs" role="tablist"
                                aria-orientation="horizontal">
                                <button th:each="niveau, iter : ${niveaux}" type="button"
                                    th:data-level-id="${niveau.id}"
                                    th:classappend="${iter.first} ? 'active' : ''"
                                    class="level-filter-btn hs-tab-active:bg-surface-active hs-tab-active:text-layer-foreground py-2 px-4 inline-flex items-center gap-x-2 bg-transparent text-xs text-muted-foreground-1 font-medium rounded-lg  focus:outline-none  disabled:opacity-50 disabled:pointer-events-none"
                                    role="tab" th:data-hs-tab="${'#panel-ue-niveau-' + niveau.id}"
                                    th:aria-controls="${'panel-ue-niveau-' + niveau.id}">
                                    <span th:text="'Niveau ' + ${niveau.ordre}">Niveau 1</span>
                                </button>
                            </nav>
                        </div>
                    </div>
                    <div>

                        <!-- Specialty Tabs -->
                        <div class="mb-8    bg-background-1 flex justify-between items-center">
                            <nav id="specialty-tabs" class="flex gap-x-3 overflow-x-auto no-scrollbar"
                                aria-label="Tabs">
                                <!-- Populated via JS -->
                                <span class="py-4 text-sm text-muted-foreground-2 italic">Sélectionnez un
                                    niveau...</span>
                            </nav>
                            <div class="flex gap-3 items-center">
                                <select id="semester-filter"
                                    data-hs-select='{
                                      "toggleTag": "<button type=\"button\" aria-expanded=\"false\"></button>",
                                      "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-2 ps-3 pe-9 flex text-nowrap w-52 cursor-pointer bg-layer border border-layer-line text-layer-foreground rounded-full text-start text-sm hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus",
                                      "dropdownClasses": "mt-2 z-50 w-full max-h-72 p-1 space-y-0.5 bg-select border border-select-line rounded-lg shadow-xl overflow-hidden overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb",
                                      "optionClasses": "hs-selected:bg-select-item-active py-2 px-4 w-full text-sm text-select-item-foreground cursor-pointer hover:bg-select-item-hover rounded-lg focus:outline-hidden focus:bg-select-item-focus hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50",
                                      "optionTemplate": "<div class=\"flex justify-between items-center w-full\"><span data-title></span><span class=\"hidden hs-selected:block\"><svg class=\"shrink-0 size-3.5 text-primary\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></span></div>",
                                      "extraMarkup": "<div class=\"absolute top-1/2 end-3 -translate-y-1/2\"><svg class=\"shrink-0 size-3.5 text-muted-foreground-1\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m7 15 5 5 5-5\"/><path d=\"m7 9 5-5 5 5\"/></svg></div>"
                                    }'
                                    class="hidden">
                                    <option value="all" selected>Tous les semestres</option>
                                    <option value="1">Semestre 1</option>
                                    <option value="2">Semestre 2</option>
                                </select>
                                <div class="relative w-full sm:w-64">
                                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 size-4 text-muted-foreground-2"
                                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <circle cx="11" cy="11" r="8" />
                                        <path d="m21 21-4.34-4.34" />
                                    </svg>
                                    <input id="subject-search" type="text" placeholder="Rechercher une UE..."
                                        class="pl-9 pr-4 py-2 w-full text-sm bg-layer border border-layer-line rounded-xl text-layer-foreground placeholder:text-muted-foreground-2 focus:outline-none focus:ring-1 focus:ring-primary transition-all" />
                                </div>
                                

                            </div>
                        </div>

                        <!-- Subjects Grid -->
                        <div id="subjects-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Populated via JS -->
                        </div>

                        <!-- Pagination -->
                        <div id="pagination-container" class="mt-6 flex justify-end">
                        </div>



                    </div>


                </div>
            </div>

        </section>
    </section>

    <!-- Modal Ajout UE (Copied from APSpecialite) -->
    <div id="hs-modal-add-ue"
        class="hs-overlay hidden size-full fixed top-0 start-0 z-80 overflow-x-hidden overflow-y-auto pointer-events-none"
        role="dialog" tabindex="-1">
        <div
            class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-300 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-layer border border-layer-line shadow-lg rounded-2xl pointer-events-auto">
                <div class="flex justify-between items-center py-4 px-6 border-b border-layer-line">
                    <h3 class="font-bold text-lg text-layer-foreground">Ajouter une UE</h3>
                    <button type="button"
                        class="size-8 inline-flex justify-center items-center rounded-full border border-transparent bg-layer-hover text-layer-foreground hover:bg-layer-focus focus:outline-none"
                        data-hs-overlay="#hs-modal-add-ue">
                        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                        </svg>
                    </button>
                </div>

                <form id="addUeForm">
                    <div class="px-6 py-4 space-y-5">
                        <input type="hidden" id="modal-specialite-id" name="specialiteId">

                        <div>
                            <label class="block text-sm font-medium mb-2 text-layer-foreground">Nom de l'Unité d'Enseignement</label>
                            <input type="text" name="libelle" placeholder="Ex: Algorithmique avancée"
                                class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all"
                                required>
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Code</label>
                                <input type="text" name="code" placeholder="Ex: UE301"
                                    class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all"
                                    required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Crédits ECTS</label>
                                <input type="number" min="1" max="100" name="credit" value="3"
                                    class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all"
                                    required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Volume Horaire (H)</label>
                                <input type="number" min="1" name="volumeHoraireTotal" value="30"
                                    class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all"
                                    required>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Couleur badge</label>
                                <div class="flex items-center gap-2">
                                    <input type="color" name="couleur" value="#7c3aed"
                                        class="p-1 h-9 w-full block bg-layer border border-layer-line rounded-md cursor-pointer">
                                </div>
                            </div>

                            <div>
                            <label class="block text-sm font-medium mb-2 text-layer-foreground">Semestre</label>
                            <select name="semestre"
                                data-hs-select='{
                                  "toggleTag": "<button type=\"button\" aria-expanded=\"false\"></button>",
                                  "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-2 ps-4 pe-9 flex text-nowrap w-full cursor-pointer bg-layer border border-layer-line text-layer-foreground rounded-md text-start text-sm hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus",
                                  "dropdownClasses": "mt-2 z-50 w-full max-h-72 p-1 space-y-0.5 bg-select border border-select-line rounded-lg shadow-xl overflow-hidden overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb",
                                  "optionClasses": "hs-selected:bg-select-item-active py-2 px-4 w-full text-sm text-select-item-foreground cursor-pointer hover:bg-select-item-hover rounded-lg focus:outline-hidden focus:bg-select-item-focus hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50",
                                  "optionTemplate": "<div class=\"flex justify-between items-center w-full\"><span data-title></span><span class=\"hidden hs-selected:block\"><svg class=\"shrink-0 size-3.5 text-primary\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></span></div>",
                                  "extraMarkup": "<div class=\"absolute top-1/2 end-3 -translate-y-1/2\"><svg class=\"shrink-0 size-3.5 text-muted-foreground-1\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m7 15 5 5 5-5\"/><path d=\"m7 9 5-5 5 5\"/></svg></div>"
                                }'
                                class="hidden">
                                <option value="1">Semestre 1</option>
                                <option value="2">Semestre 2</option>
                            </select>
                        </div>
                        </div>

                        

                        <div>
                            <label class="block text-sm font-medium mb-2 text-layer-foreground">Description (Optionnel)</label>
                            <textarea name="description"
                                class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all"
                                rows="3" placeholder="Brève description du cours..."></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end items-center gap-x-2 py-4 px-6  border-layer-line">
                        <button type="button"
                            class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-layer-line bg-layer text-layer-foreground  hover:bg-muted transition-all"
                            data-hs-overlay="#hs-modal-add-ue">Annuler</button>
                        <button id="btn-create-ue" type="submit"
                            class="py-2 px-6 inline-flex items-center gap-8.5 text-sm font-bold rounded-lg border border-transparent bg-primary text-white hover:bg-primary-hover  transition-all">
                            Créer l'UE
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Vue détaillée OffreUe -->
    <div id="hs-modal-view-offre-ue"
        class="hs-overlay hidden size-full  fixed top-0 start-0 z-80 overflow-x-hidden overflow-y-auto pointer-events-none"
        role="dialog" tabindex="-1">
        <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-300 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-layer border border-layer-line shadow-lg rounded-2xl pointer-events-auto">

                <!-- Header -->
                <div class="flex justify-between items-center pt-4 px-6">
                    <div class="flex items-center gap-3">
                       
                       
                            <h3 id="view-ue-libelle" class="font-semibold text-md text-layer-foreground">—</h3>
                    
                    </div>
                    <button type="button"
                        class="size-8 inline-flex justify-center items-center rounded-full border border-transparent bg-layer-hover text-layer-foreground hover:bg-layer-focus focus:outline-none"
                        data-hs-overlay="#hs-modal-view-offre-ue">
                        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Tabs Navigation -->
                <!-- Tabs Navigation -->
                <div class="px-6 py-3">
                    <div class="flex bg-surface-2 rounded-lg p-1">
                        <nav class="flex gap-x-1 w-full" role="tablist" aria-label="Détails UE">
                            <button type="button" role="tab" id="view-tab-desc-btn"
                                data-hs-tab="#view-panel-description"
                                aria-controls="view-panel-description" aria-selected="true"
                                class="hs-tab-active:bg-card hs-tab-active:text-layer-foreground  flex-1 py-2 px-3 inline-flex justify-center items-center gap-x-1.5 bg-transparent text-xs text-muted-foreground-1 font-medium rounded-lg focus:outline-none disabled:opacity-50 disabled:pointer-events-none active">
                                <i class="bi bi-file-text"></i>
                                Description
                            </button>
                            <button type="button" role="tab" id="view-tab-trans-btn"
                                data-hs-tab="#view-panel-transactions"
                                aria-controls="view-panel-transactions" aria-selected="false"
                                class="hs-tab-active:bg-card hs-tab-active:text-layer-foreground  flex-1 py-2 px-3 inline-flex justify-center items-center gap-x-1.5 bg-transparent text-xs text-muted-foreground-1 font-medium rounded-lg focus:outline-none disabled:opacity-50 disabled:pointer-events-none">
                                <i class="bi bi-clock-history"></i>
                                Historique
                            </button>
                            <button type="button" role="tab" id="view-tab-profs-btn"
                                data-hs-tab="#view-panel-professeurs"
                                aria-controls="view-panel-professeurs" aria-selected="false"
                                class="hs-tab-active:bg-card hs-tab-active:text-layer-foreground  flex-1 py-2 px-3 inline-flex justify-center items-center gap-x-1.5 bg-transparent text-xs text-muted-foreground-1 font-medium rounded-lg focus:outline-none disabled:opacity-50 disabled:pointer-events-none">
                                <i class="bi bi-people"></i>
                                Professeurs
                            </button>
                            <button type="button" role="tab" id="view-tab-stats-btn"
                                data-hs-tab="#view-panel-stats"
                                aria-controlts="view-panel-stats" aria-selected="false"
                                class="hs-tab-active:bg-card hs-tab-active:text-layer-foreground  flex-1 py-2 px-3 inline-flex justify-center items-center gap-x-1.5 bg-transparent text-xs text-muted-foreground-1 font-medium rounded-lg focus:outline-none disabled:opacity-50 disabled:pointer-events-none">
                                <i class="bi bi-bar-chart"></i>
                                Statistiques
                            </button>
                        </nav>
                    </div>
                </div>

                <!-- Tab Panels -->
                <div class="px-6 py-2 overflow-y-auto" style="max-height: 62vh;">

                    <!-- Description Panel -->
                    <div id="view-panel-description" role="tabpanel" aria-labelledby="view-tab-desc-btn">
                        <dl >
                            <div class="flex items-center  gap-2 py-3">
                                <dt class="text-sm text-muted-foreground-2 shrink-0 w-36">Code</dt>
                                <span class="flex-1 self-end border-b border-dashed border-layer-line mb-0.5"></span>
                                <dd id="view-desc-code" class="text-sm font-medium text-layer-foreground shrink-0 text-right">—</dd>
                            </div>
                            <div class="flex items-center gap-2 py-3">
                                <dt class="text-sm text-muted-foreground-2 shrink-0 w-36">Crédits ECTS</dt>
                                <span class="flex-1 self-end border-b border-dashed border-layer-line mb-0.5"></span>
                                <dd id="view-desc-credit" class="text-sm font-medium text-layer-foreground shrink-0 text-right">—</dd>
                            </div>
                            <div class="flex items-center gap-2 py-3">
                                <dt class="text-sm text-muted-foreground-2 shrink-0 w-36">Volume horaire</dt>
                                <span class="flex-1 self-end border-b border-dashed border-layer-line mb-0.5"></span>
                                <dd id="view-desc-vh" class="text-sm font-medium text-layer-foreground shrink-0 text-right">—</dd>
                            </div>
                            <div class="flex items-center gap-2 py-3">
                                <dt class="text-sm text-muted-foreground-2 shrink-0 w-36">Semestre</dt>
                                <span class="flex-1 self-end border-b border-dashed border-layer-line mb-0.5"></span>
                                <dd id="view-desc-semestre" class="text-sm font-medium text-layer-foreground shrink-0 text-right">—</dd>
                            </div>
                            <div class="flex items-center gap-2 py-3">
                                <dt class="text-sm text-muted-foreground-2 shrink-0 w-36">Créé le</dt>
                                <span class="flex-1 self-end border-b border-dashed border-layer-line mb-0.5"></span>
                                <dd id="view-desc-created" class="text-sm font-medium text-layer-foreground shrink-0 text-right">—</dd>
                            </div>
                            <div class="py-4">
                                <dt class="text-sm text-muted-foreground-2 mb-2">Description</dt>
                                <dd id="view-desc-text" class="text-sm text-layer-foreground leading-relaxed">Aucune description disponible.</dd>
                            </div>
                            <div class="flex justify-end">
                                 <button type="button" id="btn-view-to-edit"
                        class="py-2 px-5 inline-flex items-center gap-x-2 text-xs  rounded-lg border text-foreground hover:bg-card-active  transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        Modifier
                    </button>
                            </div>
                        </dl>
                    </div>

                    <!-- Transactions Panel -->
                    <div id="view-panel-transactions" role="tabpanel" aria-labelledby="view-tab-trans-btn" class="hidden">
                        <div id="view-transactions-list"></div>
                    </div>

                    <!-- Professeurs Panel -->
                    <div id="view-panel-professeurs" role="tabpanel" aria-labelledby="view-tab-profs-btn" class="hidden">
                        <div id="view-professeurs-list"></div>
                    </div>

                    <!-- Statistiques Panel -->
                    <div id="view-panel-stats" role="tabpanel" aria-labelledby="view-tab-stats-btn" class="hidden">
                        <div id="view-stats-content"></div>
                    </div>

                </div>

                <!-- Footer -->
               <div class="h-4"></div>
            </div>
        </div>
    </div>

    <!-- Modal Édition OffreUe -->
    <div id="hs-modal-edit-offre-ue"
        class="hs-overlay hidden size-full fixed top-0 start-0 z-80 overflow-x-hidden overflow-y-auto pointer-events-none"
        role="dialog" tabindex="-1">
        <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-300 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-layer border border-layer-line shadow-lg rounded-2xl pointer-events-auto">
                <div class="flex justify-between items-center py-4 px-6 border-b border-layer-line">
                    <h3 class="font-bold text-lg text-layer-foreground">Modifier l'offre UE</h3>
                    <button type="button"
                        class="size-8 inline-flex justify-center items-center rounded-full border border-transparent bg-layer-hover text-layer-foreground hover:bg-layer-focus focus:outline-none"
                        data-hs-overlay="#hs-modal-edit-offre-ue">
                        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>
                <form id="editOffreUeForm">
                    <div class="px-6 py-4 space-y-5">
                        <input type="hidden" id="edit-offre-id" name="offreId">

                        <div>
                            <label class="block text-sm font-medium mb-2 text-layer-foreground">Nom de l'Unité d'Enseignement</label>
                            <input type="text" id="edit-offre-libelle" name="libelle"
                                placeholder="Ex: Algorithmique avancée"
                                class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all" required>
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Code</label>
                                <input type="text" id="edit-offre-code" name="code"
                                    placeholder="Ex: UE301"
                                    class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Crédits ECTS</label>
                                <input type="number" min="1" max="100" id="edit-offre-credit" name="credit"
                                    class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Volume Horaire (H)</label>
                                <input type="number" min="1" id="edit-offre-vh" name="volumeHoraireTotal"
                                    class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all" required>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Couleur badge</label>
                                <input type="color" id="edit-offre-couleur" name="couleur" value="#7c3aed"
                                    class="p-1 h-9 w-full block bg-layer border border-layer-line rounded-md cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-layer-foreground">Semestre</label>
                                <select id="edit-offre-semestre" name="semestre"
                                    data-hs-select='{
                                      "toggleTag": "<button type=\"button\" aria-expanded=\"false\"></button>",
                                      "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-2 ps-4 pe-9 flex text-nowrap w-full cursor-pointer bg-layer border border-layer-line text-layer-foreground rounded-md text-start text-sm hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus",
                                      "dropdownClasses": "mt-2 z-50 w-full max-h-72 p-1 space-y-0.5 bg-select border border-select-line rounded-lg shadow-xl overflow-hidden overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb",
                                      "optionClasses": "hs-selected:bg-select-item-active py-2 px-4 w-full text-sm text-select-item-foreground cursor-pointer hover:bg-select-item-hover rounded-lg focus:outline-hidden focus:bg-select-item-focus hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50",
                                      "optionTemplate": "<div class=\"flex justify-between items-center w-full\"><span data-title></span><span class=\"hidden hs-selected:block\"><svg class=\"shrink-0 size-3.5 text-primary\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></span></div>",
                                      "extraMarkup": "<div class=\"absolute top-1/2 end-3 -translate-y-1/2\"><svg class=\"shrink-0 size-3.5 text-muted-foreground-1\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m7 15 5 5 5-5\"/><path d=\"m7 9 5-5 5 5\"/></svg></div>"
                                    }'
                                    class="hidden">
                                    <option value="1">Semestre 1</option>
                                    <option value="2">Semestre 2</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2 text-layer-foreground">Description (Optionnel)</label>
                            <textarea id="edit-offre-description" name="description" rows="3"
                                placeholder="Brève description du cours..."
                                class="py-2 px-4 block w-full bg-layer border border-layer-line rounded-md text-sm focus:border-primary focus:ring-primary transition-all"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end items-center gap-x-2 py-4 px-6 border-layer-line">
                        <button type="button"
                            class="py-2 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-layer-line bg-layer text-layer-foreground hover:bg-muted transition-all"
                            data-hs-overlay="#hs-modal-edit-offre-ue">Annuler</button>
                        <button id="btn-update-offre-ue" type="submit"
                            class="py-2 px-6 inline-flex items-center gap-x-2 text-sm font-bold rounded-lg border border-transparent bg-primary text-white hover:bg-primary-hover transition-all">
                            Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Data Injection for JS -->
   
    <script th:src="@{/js/other/toastify.js}"></script>
    <script th:src="@{/js/preline.js}"></script>
    
    <script type="module" th:src="@{/js/common/themeToggle.js}"></script>
    <script type="module" th:src="@{/js/common/apBreadcrumbs.js}"></script>
    <script type="module" th:src="@{/js/APInterface/apSubjects.js}"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof HSStaticMethods !== 'undefined') HSStaticMethods.autoInit();
        });
        window.addEventListener('load', () => {
            if (typeof HSStaticMethods !== 'undefined') HSStaticMethods.autoInit();
        });
        window.KEMO_DATA = {
            niveaux: /*[[${niveaux}]]*/[],
            specialites: /*[[${specialites}]]*/[],
            classes: /*[[${classes}]]*/[]
        };
    </script>
</body>

</html>
