<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head></head>

<body>

    <div th:fragment="schedule-tab-content(schedules, status)" th:id="'container-' + ${status}">

        <!-- Filter row : level pills + search -->
        <div class="mb-8 bg-background-1 flex flex-wrap sm:flex-nowrap items-center justify-between gap-4">
            <nav class="flex items-center gap-x-3 overflow-x-auto no-scrollbar" aria-label="Filtres niveau">
                <button type="button"
                    th:data-filter-status="${status}"
                    data-filter-level="all"
                    class="level-filter-btn py-2 px-4 inline-flex items-center gap-x-2 text-xs font-medium rounded-full transition-all focus:outline-none disabled:opacity-50 disabled:pointer-events-none active bg-surface-active text-foreground">
                    Tous
                </button>
                <button type="button"
                    th:each="n : ${niveaux}"
                    th:data-filter-status="${status}"
                    th:data-filter-level="${n.id}"
                    class="level-filter-btn py-2 px-4 inline-flex items-center gap-x-2 text-xs font-medium rounded-full transition-all focus:outline-none disabled:opacity-50 disabled:pointer-events-none bg-transparent text-muted-foreground-1 hover:text-layer-foreground">
                    <span th:text="'N' + ${n.ordre}">N1</span>
                </button>
            </nav>
            <div class="relative w-full sm:w-64">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 size-4 text-muted-foreground-2"
                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.34-4.34" />
                </svg>
                <input type="text" placeholder="Rechercher une classe..."
                    class="pl-9 pr-4 py-2 w-full text-sm bg-layer border border-layer-line rounded-xl text-layer-foreground placeholder:text-muted-foreground-2 focus:outline-none focus:ring-1 focus:ring-primary transition-all" />
            </div>
        </div>

        <!-- Cards grid -->
        <div th:id="'cards-grid-' + ${status}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

            <!-- Static cards rendered by Thymeleaf (ongoing pane initial data) -->
            <div th:each="et : ${schedules}"
                th:data-level-id="${specialiteMap[classMap[et.classeId]?.specialiteId]?.niveauId}"
                class="schedule-card relative bg-card border border-card-line rounded-xl p-5 hover:shadow-sm transition-all">

                <!-- Actions : positionnées en absolu haut-droite -->
                <div class="absolute top-3 right-3 flex items-center gap-0.5 bg-layer border border-layer-line rounded-lg p-0.5">
                    <a th:href="@{/ap/schedule/edit(id=${et.id})}"
                        class="size-7 inline-flex items-center justify-center text-muted-foreground-2 hover:text-primary hover:bg-primary/10 rounded-md transition-all"
                        title="Modifier">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                        </svg>
                    </a>
                    <button type="button" th:onclick="'deleteSchedule(' + ${et.id} + ')'"
                        class="size-7 inline-flex items-center justify-center text-muted-foreground-2 hover:text-red-500 hover:bg-red-500/10 rounded-md transition-all"
                        title="Supprimer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                    </button>
                </div>

                <!-- Badge : numéro de semaine -->
                <div class="mb-3">
                    <span class="rounded-full bg-primary/10 px-3 py-1 text-xs font-semibold text-primary"
                        th:text="'Semaine ' + ${et.semaine}">Semaine 12</span>
                </div>

                <!-- Titre : code classe -->
                <h3 class="mb-0.5 text-base font-bold text-layer-foreground"
                    th:text="${classMap[et.classeId]?.code ?: 'Classe inconnue'}">Terminale S</h3>

                <!-- Spécialité -->
                <p class="text-xs font-medium text-muted-foreground-1 mb-1.5"
                    th:text="${#strings.capitalize(#strings.toLowerCase(specialiteMap[classMap[et.classeId]?.specialiteId]?.libelle ?: ''))}">
                    Informatique</p>

                <!-- Période -->
                <p class="text-sm text-muted-foreground-2"
                    th:text="'du ' + ${#temporals.format(et.dateDebut, 'dd MMM yyyy')} + ' au ' + ${#temporals.format(et.dateFin, 'dd MMM yyyy')}">
                    du 18 au 22 Mars 2024
                </p>
            </div>

            <!-- Loading / empty placeholder (remplacé dynamiquement par JS) -->
            <div th:if="${#lists.isEmpty(schedules)}" th:id="'placeholder-' + ${status}"
                class="col-span-full py-20 flex flex-col items-center justify-center gap-3">
                <div class="animate-spin size-8 border-[3px] border-current border-t-transparent text-primary rounded-full"></div>
                <p class="text-sm font-medium text-layer-foreground">Chargement des données...</p>
            </div>
        </div>
    </div>

</body>

</html>
