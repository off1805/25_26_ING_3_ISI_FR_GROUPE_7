<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" class="dark" data-theme="theme-kemoschool">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KemOSchool — Mes Cours</title>
    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>

<body class="h-screen">
    <section class="flex flex-row bg-sidebar-nav-hover h-full">

        <!-- SIDEBAR -->
        <section th:replace="~{common/SidebarFragment :: content}" th:with="sidebarRole='TEACHER', activePage='cours',
            sidebarFullName=${teacher != null and teacher.profile != null ? teacher.profile.prenom + ' ' + teacher.profile.nom : 'Enseignant'}"></section>

        <!-- MAIN -->
        <section class="flex-1 flex flex-col overflow-hidden">

            <!-- NAVBAR -->
            <header class="flex-none flex justify-between items-center px-4 sm:px-6 py-2 bg-navbar border-b border-navbar-line">
                <div class="flex items-center gap-3">
                    <button type="button"
                        class="lg:hidden size-9 flex items-center justify-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-layer-hover transition-colors"
                        data-hs-overlay="#hs-app-sidebar" aria-controls="hs-app-sidebar" aria-label="Ouvrir menu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <nav class="hidden lg:flex items-center gap-x-1.5 text-sm text-muted-foreground">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5">
                            <path d="M5 12l-2 0l9-9l9 9l-2 0" />
                            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
                        </svg>
                        <span>Espace enseignant</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M9 6l6 6l-6 6" />
                        </svg>
                        <span class="font-semibold text-layer-foreground">Mes Cours</span>
                    </nav>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" data-theme-toggle
                        class="size-9 flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted">
                        <svg data-theme-icon="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                            <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 8.607 9.426a9 9 0 1 1 -9 -9.426z" />
                        </svg>
                        <svg data-theme-icon="sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="17"
                            height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                        </svg>
                    </button>
                    <div class="size-9 rounded-xl bg-primary flex items-center justify-center text-sm font-bold text-white cursor-pointer shadow-sm"
                        th:text="${teacher != null and teacher.profile != null and teacher.profile.nom != null ? #strings.toUpperCase(#strings.substring(teacher.profile.nom, 0, 1)) : 'E'}">
                        E</div>
                </div>
            </header>

            <!-- PAGE CONTENT -->
            <div class="flex-1 overflow-y-auto p-6 lg:p-10 bg-background">
                <div class="w-full mx-auto">

                    <!-- Page Header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                        <div>
                            <h2 class="text-2xl font-bold text-layer-foreground">Mes Cours</h2>
                            <p class="text-sm text-muted-foreground-2 mt-1">Vue d'ensemble de vos matières et classes — cliquez sur une carte pour les statistiques détaillées.</p>
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="mb-7 flex flex-wrap gap-3 items-center justify-between">
                        <!-- Semestre tabs -->
                        <div class="flex bg-surface rounded-lg p-1">
                            <nav class="flex gap-x-1" role="tablist">
                                <button type="button" class="sem-filter-btn active-sem py-2 px-4 text-xs font-medium rounded-lg transition-all bg-surface-active text-layer-foreground" data-sem="all">Tous les semestres</button>
                                <button type="button" class="sem-filter-btn py-2 px-4 text-xs font-medium rounded-lg transition-all bg-transparent text-muted-foreground-1" data-sem="1">Semestre 1</button>
                                <button type="button" class="sem-filter-btn py-2 px-4 text-xs font-medium rounded-lg transition-all bg-transparent text-muted-foreground-1" data-sem="2">Semestre 2</button>
                            </nav>
                        </div>
                        <!-- Search + classe filter -->
                        <div class="flex gap-3 items-center">
                            <select id="classe-filter" class="py-2 ps-3 pe-9 text-sm bg-layer border border-layer-line text-layer-foreground rounded-full cursor-pointer hover:bg-layer-hover focus:outline-none transition-all w-44">
                                <option value="all">Toutes les classes</option>
                            </select>
                            <div class="relative w-full sm:w-64">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 size-4 text-muted-foreground-2"
                                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8" />
                                    <path d="m21 21-4.34-4.34" />
                                </svg>
                                <input id="cours-search" type="text" placeholder="Rechercher un cours..."
                                    class="pl-9 pr-4 py-2 w-full text-sm bg-layer border border-layer-line rounded-xl text-layer-foreground placeholder:text-muted-foreground-2 focus:outline-none focus:ring-1 focus:ring-primary transition-all" />
                            </div>
                        </div>
                    </div>

                    <!-- Grid -->
                    <div id="cours-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Loading skeleton -->
                        <div id="cours-loading" class="col-span-full flex justify-center py-16">
                            <div class="animate-spin size-6 border-[2px] border-current border-t-transparent text-primary rounded-full"></div>
                        </div>
                    </div>

                </div>
            </div>

        </section>
    </section>

    <!-- ═══════════════════════════════════════
         Modal — Détail cours
    ═══════════════════════════════════════ -->
    <div id="hs-modal-cours-detail"
        class="hs-overlay hidden size-full fixed top-0 start-0 z-80 overflow-x-hidden overflow-y-auto pointer-events-none"
        role="dialog" tabindex="-1">
        <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-300 mt-0 opacity-0 ease-out transition-all sm:max-w-2xl sm:w-full m-3 sm:mx-auto">
            <div class="flex flex-col bg-layer border border-layer-line shadow-lg rounded-2xl pointer-events-auto">

                <!-- Header -->
                <div class="flex justify-between items-start pt-5 px-6">
                    <div class="flex items-center gap-3">
                        <div id="modal-color-dot" class="size-3 rounded-full shrink-0" style="background:#7c3aed"></div>
                        <div>
                            <h3 id="modal-cours-libelle" class="font-semibold text-base text-layer-foreground">—</h3>
                            <p id="modal-cours-meta" class="text-xs text-muted-foreground-2 mt-0.5">—</p>
                        </div>
                    </div>
                    <button type="button"
                        class="size-8 inline-flex justify-center items-center rounded-full border border-transparent bg-layer-hover text-layer-foreground hover:bg-layer-focus focus:outline-none"
                        data-hs-overlay="#hs-modal-cours-detail">
                        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Statistiques -->
                <div class="px-6 py-4 overflow-y-auto" style="max-height: 60vh;">
                    <div id="modal-stats-content" class="space-y-4">
                        <div class="flex justify-center py-8">
                            <div class="animate-spin size-5 border-[2px] border-current border-t-transparent text-primary rounded-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Footer — lien vers la liste de la classe -->
                <div class="px-6 pb-5 pt-3 border-t border-layer-line">
                    <a id="modal-liste-link" href="#"
                       class="flex items-center justify-center gap-2 w-full py-2.5 text-sm font-semibold rounded-xl bg-primary text-white hover:bg-primary/90 active:scale-[0.98] transition-all">
                        <i class="bi bi-people"></i>
                        Voir la liste de la classe
                        <i class="bi bi-arrow-right-short text-base leading-none"></i>
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/js/other/toastify.js}"></script>
    <script th:src="@{/js/preline.js}"></script>
    <script type="module" th:src="@{/js/common/themeToggle.js}"></script>
    <script type="module" th:src="@{/js/TeacherInterface/teacherCours.js}"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof HSStaticMethods !== 'undefined') HSStaticMethods.autoInit();
        });
        window.addEventListener('load', () => {
            if (typeof HSStaticMethods !== 'undefined') HSStaticMethods.autoInit();
        });
    </script>
    <script th:src="@{/js/preline.js}"></script>
</body>

</html>
