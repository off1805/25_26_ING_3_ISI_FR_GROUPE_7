<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" class="dark" data-theme="theme-kemoschool">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KemOSchool — Liste de la classe</title>
    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>

<body class="h-screen flex flex-col bg-background overflow-hidden">

    <!-- ═══════════════════════════════════════
         NAVBAR
    ═══════════════════════════════════════ -->
    <header class="flex-none flex justify-between items-center px-4 sm:px-6 py-2 bg-navbar border-b border-navbar-line">
        <div class="flex items-center gap-3 min-w-0">
            <a th:href="@{/teacher/cours}"
               class="shrink-0 size-9 flex items-center justify-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-layer-hover transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 5l-7 7 7 7"/>
                </svg>
            </a>
            <div class="min-w-0">
                <h1 id="page-cours-libelle" class="text-sm font-bold text-layer-foreground truncate">Chargement…</h1>
                <p id="page-cours-meta" class="text-xs text-muted-foreground-2 truncate">—</p>
            </div>
        </div>
        <div class="shrink-0 flex items-center gap-2 ml-4">
            <button type="button" data-theme-toggle
                class="size-9 flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground hover:bg-muted">
                <svg data-theme-icon="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 8.607 9.426a9 9 0 1 1 -9 -9.426z"/>
                </svg>
                <svg data-theme-icon="sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ═══════════════════════════════════════
         MAIN — deux colonnes
    ═══════════════════════════════════════ -->
    <div class="flex-1 flex overflow-hidden">

        <!-- ── Colonne gauche : liste étudiants ──────────────────────────────
             Toujours visible. max-w-sm = 384 px (compilé via TeacherSeance).
             Sur mobile : w-full → plein écran.
             Sur desktop : max-w-sm flex-shrink-0 → colonne fixe de 384 px.   -->
        <div id="left-panel"
             class="w-full max-w-sm flex-shrink-0 flex flex-col border-r border-layer-line bg-sidebar overflow-hidden">

            <!-- En-tête -->
            <div class="px-5 py-4 border-b border-layer-line flex-shrink-0">
                <div class="flex items-center justify-between gap-3 mb-3">
                    <div>
                        <h3 class="font-semibold text-layer-foreground">Étudiants de la classe</h3>
                        <p class="text-xs text-muted-foreground-2 mt-0.5">
                            <span id="student-count">—</span> inscrits
                        </p>
                    </div>
                    <span class="shrink-0 size-8 flex items-center justify-center rounded-xl bg-primary/10 text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="1.75">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </span>
                </div>
                <!-- Recherche -->
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 size-3.5 text-muted-foreground-2 pointer-events-none"
                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.34-4.34"/>
                    </svg>
                    <input type="text" id="student-search" placeholder="Rechercher un étudiant…"
                        class="pl-9 pr-4 py-2 w-full text-sm bg-background border border-layer-line rounded-xl
                               text-layer-foreground placeholder:text-muted-foreground-2
                               focus:outline-none focus:ring-1 focus:ring-primary transition-all"/>
                </div>
            </div>

            <!-- Liste scrollable -->
            <div class="flex-1 overflow-y-auto p-3" id="student-list">
                <div class="flex flex-col items-center justify-center gap-2 py-10 text-muted-foreground-2">
                    <div class="size-6 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs">Chargement des étudiants…</p>
                </div>
            </div>

        </div>

        <!-- ── Colonne droite : détail étudiant ──────────────────────────────
             hidden sur mobile, md:flex sur desktop (flex-1 = prend le reste). -->
        <div id="right-panel" class="hidden md:flex flex-1 overflow-y-auto flex-col p-8">

            <!-- État vide (défaut) — flex-1 pour centrer verticalement -->
            <div id="right-empty" class="flex flex-col items-center justify-center flex-1 gap-4 text-center">
                <div class="size-16 rounded-2xl bg-muted flex items-center justify-center mx-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="1.25" class="text-muted-foreground-2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div>
                    <p class="text-base font-semibold text-layer-foreground">Sélectionnez un étudiant</p>
                    <p class="text-sm text-muted-foreground-2 mt-1 max-w-xs mx-auto">
                        Cliquez sur un étudiant dans la liste pour consulter ses statistiques de présence.
                    </p>
                </div>
            </div>

            <!-- Détail (peuplé par JS) -->
            <div id="right-detail" class="hidden w-full max-w-lg mx-auto"></div>

        </div>

    </div>

    <!-- ═══════════════════════════════════════
         DRAWER MOBILE — Détail étudiant
         z-index via style= inline pour garantir
         la valeur sans dépendre de Tailwind.
         Transition et transform gérés par JS.
    ═══════════════════════════════════════ -->

    <!-- Backdrop — z-index 199, sous le drawer -->
    <div id="drawer-backdrop"
         class="hidden fixed inset-0 bg-black/50 md:hidden"
         style="z-index: 199;"
         onclick="closeStudentDrawer()"></div>

    <!-- Drawer — z-index 200, au-dessus du backdrop
         La position initiale (translateY) et la transition
         sont appliquées par JS dans openDrawer().             -->
    <div id="student-drawer"
         class="hidden fixed inset-x-0 bottom-0 md:hidden
                bg-layer border-t border-layer-line rounded-t-2xl shadow-2xl"
         style="z-index: 200; transition: transform 0.3s ease-out;">

        <!-- Poignée -->
        <div class="flex justify-center pt-3">
            <div class="w-10 h-1 rounded-full bg-muted-foreground-2/30"></div>
        </div>

        <!-- En-tête fixe : avatar + nom + matricule + bouton fermer
             Le contenu du drawer n'affiche PAS ces infos (évite le doublon). -->
        <div class="flex items-center justify-between px-5 pt-3 pb-4 border-b border-layer-line">
            <div class="flex items-center gap-3 min-w-0">
                <div id="drawer-avatar"
                     class="size-10 rounded-xl flex items-center justify-center text-sm font-bold text-white shrink-0">
                    ??
                </div>
                <div class="min-w-0">
                    <h3 id="drawer-student-name" class="font-bold text-base text-layer-foreground truncate">—</h3>
                    <p id="drawer-student-matricule" class="text-xs text-muted-foreground-2">—</p>
                </div>
            </div>
            <button type="button" onclick="closeStudentDrawer()"
                class="shrink-0 ml-3 size-8 flex items-center justify-center rounded-xl bg-muted text-muted-foreground-2 hover:bg-muted/80">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M18 6l-12 12M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Contenu scrollable — stats uniquement, sans répéter nom/matricule -->
        <div id="drawer-content" class="overflow-y-auto max-h-[65vh] p-5">
        </div>

    </div>

    <!-- Données injectées par Thymeleaf -->
    <script th:inline="javascript">
        window.OFFRE_UE_ID = /*[[${offreUeId}]]*/ null;
        window.CLASSE_ID   = /*[[${classeId}]]*/ null;
    </script>

    <script th:src="@{/js/preline.js}"></script>
    <script type="module" th:src="@{/js/common/themeToggle.js}"></script>
    <script type="module" th:src="@{/js/TeacherInterface/teacherClasseListe.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof HSStaticMethods !== 'undefined') HSStaticMethods.autoInit();
        });
    </script>

</body>

</html>
